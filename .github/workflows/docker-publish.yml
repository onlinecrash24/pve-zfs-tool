name: Build & Publish Docker Image

on:
  push:
    branches:
      - dev               # Dev-Branch: baut Image mit :dev Tag zum Testen
    tags:
      - "v*"               # Release-Build: ein Image, alle Release-Tags
                           # (:latest + :X.Y.Z + :X.Y + :sha-xxxxxxx)
                           # Reine main-Pushes ohne Tag triggern KEINEN
                           # Build mehr -- der nächste Tag-Push baut das
                           # Release-Image; das vermeidet die früher
                           # entstandenen Doppel-Images, bei denen
                           # :latest und :0.9.X auf unterschiedliche
                           # digests zeigten.
  pull_request:
    branches:
      - main              # Bei PRs nur bauen, nicht pushen
  workflow_dispatch:      # Manuell ausführbar über GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # onlinecrash24/pve-zfs-tool

jobs:
  # Run the pytest suite first. build-and-push depends on it, so no image
  # is published unless the tests are green -- on dev pushes, tag pushes and
  # PRs alike.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  build-and-push:
    needs: test          # gate the image build on green tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # Nötig für ghcr.io Push

    steps:
      # 1. Repo auschecken
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Docker Buildx einrichten (Multi-Plattform-Support)
      #
      # Mit Docker-Hub-Mirror "mirror.gcr.io" konfiguriert. Direkte Pulls
      # gegen registry-1.docker.io brechen auf den GHA-Runnern regelmaessig
      # mit "Client.Timeout exceeded while awaiting headers" ab (Docker-Hub-
      # Rate-Limit pro IP, transiente Ausfaelle). mirror.gcr.io ist Googles
      # offizieller, hochverfuegbarer Mirror -- buildx zieht das Base-Image
      # `python:3.12-slim` zuerst dort und nur als Fallback bei Docker Hub.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # 3. Login bei ghcr.io (automatisch mit GITHUB_TOKEN)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker Metadaten & Tags generieren
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Bei Push auf dev → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # Bei Tag v1.2.3:
            #   :latest        (zeigt auf den selben digest wie die anderen)
            #   :1.2.3 + :1.2  (semver)
            #   :sha-abc1234   (Commit-SHA, immer)
            # Alle vier Tags landen in einem einzigen Build → ein digest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # 5. Image bauen und pushen
      #
      # Cache-Strategie: GHA-Cache läuft als "continue-on-error" mit, weil
      # der GitHub-Actions-Cache-Service phasenweise mit "buildkit cache
      # export error" o.ä. ausfällt -- ohne den continue-on-error würde der
      # ganze Release-Build daran scheitern. Bei Cache-Fehlern wird einfach
      # ohne Cache neu gebaut.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag on a release build (v1.2.3), the branch name otherwise.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional: Multi-Arch (amd64 + arm64, z.B. für Raspberry Pi)
          # platforms: linux/amd64,linux/arm64

      # 5b. Fallback ohne Cache, falls Schritt 5 wegen Cache-Problemen
      # gescheitert ist. Wenn Schritt 5 sauber durchlief, wird dieser Step
      # übersprungen.
      - name: Build and push Docker image (no cache fallback)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag on a release build (v1.2.3), the branch name otherwise.
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  # Publish the GitHub release for a tag build.
  #
  # This used to be a manual step, and v0.9.920 shipped with a tag and an
  # image but no release page because someone forgot. Runs after the image so
  # the release never points at a version that failed to build.
  #
  # The notes come from the ANNOTATED TAG's own message. That keeps them
  # deliberately authored at the moment of tagging instead of degrading into a
  # generated commit list -- and it means `git show <tag>` and the release page
  # say the same thing. A tag with only a subject line still produces a
  # release, via --generate-notes, rather than nothing at all.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to create the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The default shallow checkout fetches the commit but not the tag
          # OBJECT, so its message would come back empty and every release
          # would silently fall back to generated notes.
          fetch-depth: 0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- leaving it untouched."
            exit 0
          fi
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.md
          # contents:body is empty for a one-line or lightweight tag. Checked
          # with whitespace stripped so a stray newline does not read as prose.
          body=$(git tag -l --format='%(contents:body)' "$TAG" | tr -d '[:space:]')
          if [ -n "$body" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          else
            echo "Tag $TAG carries no message body -- generating notes from commits."
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
